<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Surprise Gift 💝</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,#ffd1e6,#e9c8ff,#ffe7c2);
  color:#66364f;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 10% 15%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 80% 20%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 25% 80%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 90% 75%,#fff 0 2px,transparent 3px);
  background-size:130px 130px;
  opacity:.55;
}

.container{
  width:min(94%,650px);
  margin:25px auto;
  position:relative;
  z-index:2;
}

.card{
  background:#ffffffdc;
  backdrop-filter:blur(15px);
  border-radius:30px;
  padding:28px 20px;
  box-shadow:0 20px 60px #7c285333;
  text-align:center;
}

.screen{display:none}
.screen.active{
  display:block;
  animation:fade .7s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

h1,h2{
  font-family:"Dancing Script",cursive;
  color:#a52d69;
}

h1{font-size:48px}
h2{font-size:38px}

p{line-height:1.7}

input,textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:2px solid #efb3cc;
  border-radius:16px;
  background:#fffafd;
  font-family:Poppins,sans-serif;
  outline:none;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  border:0;
  padding:14px 22px;
  margin:7px 3px;
  border-radius:30px;
  background:linear-gradient(135deg,#e84d91,#9d5de5);
  color:white;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 20px #9c367044;
}

.secondary{
  background:white;
  color:#a23969;
  border:2px solid #efb3ca;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.category{
  padding:15px 5px;
  border:2px solid #efbdd2;
  border-radius:18px;
  background:#fff7fb;
  cursor:pointer;
  transition:.2s;
}

.category.selected{
  background:#ffe0ed;
  border-color:#dc4d8a;
  transform:scale(1.03);
}

.icon{
  display:block;
  font-size:27px;
  margin-bottom:4px;
}

/* GIFT */

.gift-stage{
  height:310px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gift{
  position:relative;
  width:180px;
  height:150px;
  cursor:pointer;
  transform-style:preserve-3d;
  filter:drop-shadow(0 20px 18px #7e2c5440);
}

.gift-box{
  position:absolute;
  bottom:0;
  left:15px;
  width:150px;
  height:115px;
  border-radius:8px;
  background:linear-gradient(135deg,#e94387,#bd3679);
}

.gift-lid{
  position:absolute;
  top:28px;
  left:5px;
  width:170px;
  height:42px;
  border-radius:8px;
  background:linear-gradient(135deg,#ff6ba5,#d13d7e);
  z-index:5;
  transform-origin:left bottom;
  transition:1.2s cubic-bezier(.2,.8,.2,1);
}

.ribbon-v{
  position:absolute;
  left:76px;
  bottom:0;
  width:28px;
  height:115px;
  background:#ffd35a;
  z-index:4;
}

.ribbon-h{
  position:absolute;
  left:5px;
  top:35px;
  width:170px;
  height:27px;
  background:#ffd35a;
  z-index:6;
}

.bow{
  position:absolute;
  top:-25px;
  left:57px;
  font-size:55px;
  z-index:8;
  transition:1s;
}

.gift.open .gift-lid{
  transform:rotate(-18deg) translate(-25px,-75px);
}

.gift.open .bow{
  transform:translateY(-75px) rotate(-12deg);
  opacity:0;
}

.open-text{
  font-family:"Dancing Script",cursive;
  font-size:31px;
  color:#a32e69;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{opacity:.55;transform:scale(1.03)}
}

/* FINAL */

.final-card{
  padding:35px 20px;
  border-radius:28px;
  background:linear-gradient(135deg,#fff0f7,#f8e8ff,#fff5df);
  box-shadow:0 20px 50px #8f326044;
  overflow:hidden;
}

.special{
  font-family:"Dancing Script",cursive;
  font-size:30px;
  color:#954067;
}

.final-name{
  font-family:"Dancing Script",cursive;
  font-size:68px;
  font-weight:700;
  color:#b72e70;
  margin:4px 0 18px;
  animation:nameReveal 1.4s ease;
  text-shadow:0 4px 12px #b72e7030;
}

@keyframes nameReveal{
  from{
    opacity:0;
    transform:scale(.5) translateY(30px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.final-message{
  white-space:pre-line;
  line-height:1.9;
  padding:22px;
  border-radius:20px;
  background:#ffffffc9;
  color:#60354c;
}

.final-photo{
  display:none;
  width:190px;
  height:190px;
  object-fit:cover;
  border-radius:50%;
  margin:15px auto;
  border:7px solid white;
  box-shadow:0 12px 35px #0002;
}

.sparkles{
  font-size:28px;
  letter-spacing:7px;
  animation:sparkle 1.4s infinite;
}

@keyframes sparkle{
  50%{transform:scale(1.1);opacity:.65}
}

.heart{
  position:fixed;
  bottom:-50px;
  font-size:25px;
  pointer-events:none;
  z-index:9999;
  animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
  to{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}

.linkbox{
  margin-top:15px;
  padding:15px;
  border-radius:18px;
  background:#fff5fa;
  word-break:break-all;
  font-size:13px;
}

@media(max-width:450px){
  h1{font-size:42px}
  h2{font-size:34px}
  .final-name{font-size:55px}
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<!-- CREATOR -->
<div class="screen active" id="creator">

<h1>💝 Secret Surprise</h1>

<p>Make a beautiful surprise gift for someone special ✨</p>

<div class="categories">

<div class="category" onclick="choose(this,'Birthday')">
<span class="icon">🎂</span>Birthday
</div>

<div class="category" onclick="choose(this,'Love')">
<span class="icon">❤️</span>Love
</div>

<div class="category" onclick="choose(this,'Anniversary')">
<span class="icon">💍</span>Anniversary
</div>

<div class="category" onclick="choose(this,'Friendship')">
<span class="icon">🫂</span>Friendship
</div>

<div class="category" onclick="choose(this,'Congratulations')">
<span class="icon">🎉</span>Congratulations
</div>

<div class="category" onclick="choose(this,'Best Wishes')">
<span class="icon">✨</span>Best Wishes
</div>

</div>

<br>

<input id="name" placeholder="Enter special person's name">

<textarea id="message"
placeholder="Write your special message..."></textarea>

<input id="photo" type="file" accept="image/*">

<br>

<button onclick="createSurprise()">
🎁 Create Surprise Link
</button>

<div id="linkResult"></div>

</div>


<!-- RECIPIENT GIFT -->
<div class="screen" id="recipient">

<div class="gift-stage">

<div class="gift" id="gift">

<div class="bow">🎀</div>
<div class="gift-lid"></div>
<div class="gift-box"></div>
<div class="ribbon-v"></div>
<div class="ribbon-h"></div>

</div>

</div>

<div class="open-text">
Tap the gift to open your surprise 💗
</div>

</div>


<!-- FINAL -->
<div class="screen" id="final">

<div class="final-card">

<div class="sparkles">✨ 💗 ✨ 💕 ✨</div>

<div class="special">
A Special Surprise For
</div>

<div class="final-name" id="finalName"></div>

<img id="finalPhoto" class="final-photo">

<div class="final-message" id="finalMessage"></div>

<br>

<div class="sparkles">💕 ✨ 💗 ✨ 💕</div>

<p>Made with love 💝</p>

<button onclick="sharePage()">🔗 Share</button>

</div>

</div>

</div>
</div>


<script>

let selectedOccasion="Best Wishes";

function choose(el,type){

  document.querySelectorAll(".category").forEach(x=>{
    x.classList.remove("selected");
  });

  el.classList.add("selected");

  selectedOccasion=type;
}


/* CREATE LINK */

function createSurprise(){

  const name=document.getElementById("name").value.trim();
  const message=document.getElementById("message").value.trim();

  if(!name){
    alert("Please enter the person's name 💗");
    return;
  }

  if(!message){
    alert("Please write a special message 💌");
    return;
  }

  const data={
    n:name,
    m:message,
    o:selectedOccasion
  };

  const encoded=btoa(
    unescape(
      encodeURIComponent(JSON.stringify(data))
    )
  );

  const link=
    window.location.origin+
    window.location.pathname+
    "?surprise="+encoded;

  document.getElementById("linkResult").innerHTML=`
    <div class="linkbox">
      <b>🎁 Your surprise is ready!</b><br><br>
      ${link}
      <br><br>
      <button onclick="copyLink('${link.replace(/'/g,"&#39;")}')">
      📋 Copy Link
      </button>
    </div>
  `;
}


/* COPY */

function copyLink(link){

  navigator.clipboard.writeText(link)
  .then(()=>{
    alert("Surprise link copied! 💗");
  })
  .catch(()=>{
    prompt("Copy this link:",link);
  });

}


/* CHECK RECIPIENT LINK */

function checkSurprise(){

  const params=new URLSearchParams(window.location.search);
  const encoded=params.get("surprise");

  if(!encoded)return;

  try{

    const data=JSON.parse(
      decodeURIComponent(
        escape(atob(encoded))
      )
    );

    window.surpriseData=data;

    document.getElementById("creator")
      .classList.remove("active");

    document.getElementById("recipient")
      .classList.add("active");

  }catch(e){

    console.log("Invalid surprise link");

  }
}


/* GIFT CLICK */

document.getElementById("gift").addEventListener("click",function(){

  const gift=this;

  gift.classList.add("open");

  createHearts();

  setTimeout(function(){

    const data=window.surpriseData;

    document.getElementById("finalName").textContent=data.n;

    document.getElementById("finalMessage").textContent=data.m;

    document.getElementById("recipient")
      .classList.remove("active");

    document.getElementById("final")
      .classList.add("active");

    createHearts();
    createHearts();

  },1400);

});


/* HEARTS */

function createHearts(){

  for(let i=0;i<18;i++){

    const h=document.createElement("div");

    h.className="heart";

    h.textContent=
      ["💗","💕","💖","✨","🌸"][Math.floor(Math.random()*5)];

    h.style.left=Math.random()*100+"vw";

    h.style.animationDelay=
      Math.random()*.8+"s";

    document.body.appendChild(h);

    setTimeout(()=>{
      h.remove();
    },4500);
  }
}


/* SHARE */

async function sharePage(){

  if(navigator.share){

    try{

      await navigator.share({
        title:"A Special Surprise 💝",
        text:"I made a special surprise for you 🎁",
        url:window.location.href
      });

    }catch(e){}

  }else{

    copyLink(window.location.href);

  }
}


/* START */

checkSurprise();

</script>

</body>
</html>
